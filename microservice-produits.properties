# Configurations H2
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# Definit l'encodage pour data.sql
spring.datasource.sql-script-encoding=UTF-8

# IMPORTANT : H2 v2 - executer data.sql apres la creation des tables par Hibernate
spring.jpa.defer-datasource-initialization=true

# Port du microservice
server.port=9001

# Les configurations externalisees
mes-configs.limitDeProduits=5

# Configuration Actuator (TP 3.2)
# expose tous les services Actuator disponibles (~24)
management.endpoints.web.exposure.include=*
# management.endpoints.web.exposure.include=refresh
